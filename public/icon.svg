<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="url(#purpleGrad)" stroke-width="3" opacity="0.4" />
  
  <!-- Outer subtle hexagon circuit -->
  <polygon points="256,64 422,160 422,352 256,448 90,352 90,160" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Crossword interlocking neon blocks symbol -->
  <g filter="url(#neonGlow)">
    <!-- Central Grid Blocks -->
    <rect x="180" y="120" width="68" height="68" rx="14" fill="#1e1b4b" stroke="url(#purpleGrad)" stroke-width="4" />
    <text x="214" y="165" font-family="sans-serif" font-weight="900" font-size="34" fill="#f8fafc" text-anchor="middle">ذ</text>

    <rect x="264" y="120" width="68" height="68" rx="14" fill="#1e1b4b" stroke="url(#purpleGrad)" stroke-width="4" />
    <text x="298" y="165" font-family="sans-serif" font-weight="900" font-size="34" fill="#a855f7" text-anchor="middle">ه</text>

    <rect x="264" y="204" width="68" height="68" rx="14" fill="#1e1b4b" stroke="url(#purpleGrad)" stroke-width="4" />
    <text x="298" y="249" font-family="sans-serif" font-weight="900" font-size="34" fill="#f8fafc" text-anchor="middle">ن</text>

    <rect x="264" y="288" width="68" height="68" rx="14" fill="#1e1b4b" stroke="url(#cyanGrad)" stroke-width="4" />
    <text x="298" y="333" font-family="sans-serif" font-weight="900" font-size="34" fill="#67e8f9" text-anchor="middle">ت</text>

    <rect x="348" y="288" width="68" height="68" rx="14" fill="#1e1b4b" stroke="url(#cyanGrad)" stroke-width="4" />
    <text x="382" y="333" font-family="sans-serif" font-weight="900" font-size="34" fill="#f8fafc" text-anchor="middle">ا</text>

    <rect x="180" y="288" width="68" height="68" rx="14" fill="#1e1b4b" stroke="url(#cyanGrad)" stroke-width="4" />
    <text x="214" y="333" font-family="sans-serif" font-weight="900" font-size="34" fill="#f8fafc" text-anchor="middle">ر</text>

    <rect x="96" y="288" width="68" height="68" rx="14" fill="#1e1b4b" stroke="url(#cyanGrad)" stroke-width="4" />
    <text x="130" y="333" font-family="sans-serif" font-weight="900" font-size="34" fill="#f8fafc" text-anchor="middle">ی</text>
  </g>

  <!-- Glowing interconnecting lines representing brain synapse / word trace -->
  <path d="M 214,154 C 256,180 298,180 298,238 C 298,270 298,280 298,322" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.6" />

  <!-- Bottom title badge: DARK MIND -->
  <g transform="translate(256, 420)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#0f172a" stroke="url(#purpleGrad)" stroke-width="2" />
    <text x="0" y="7" font-family="sans-serif" font-weight="800" font-size="19" fill="#e2e8f0" letter-spacing="4" text-anchor="middle">DARK MIND</text>
  </g>
</svg>
